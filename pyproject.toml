[project]
name = "wmr"
version = "0.1.0"
description = "Remove watermarks and logos from images and video (mask + inpainting)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0",
    "numpy>=1.26,<2.3",
    "onnxruntime-directml>=1.24.4",
    "opencv-python-headless>=4.10",
    "pillow>=10",
]

[project.scripts]
wmr = "wmr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wmr"]
